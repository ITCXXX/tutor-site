{% load cards_extras %}
{% if колоды %}
<div class="app-section-card mt-4">
    <h2 style="font-size:1.05rem;">Карточки к уроку</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.6rem;">
        {% for колода in колоды %}
        <a href="{% url 'cards:deck' колода.pk %}"
           style="display:block;padding:.8rem 1rem;border:1px solid var(--c-border);
                  border-radius:var(--r-lg);background:var(--c-surface);
                  text-decoration:none;color:inherit;">
            <b style="display:block;font-size:.95rem;">{{ колода.title }}</b>
            <span style="font-size:.78rem;color:var(--c-text-muted);">
                {{ колода.карточек }} {{ колода.карточек|слово:"карточка,карточки,карточек" }}
            </span>
        </a>
        {% endfor %}
    </div>
</div>
{% endif %}
