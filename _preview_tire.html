<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Шина — объединённый рисунок</title>
<style>
  body {
    font-family: Cambria, Georgia, serif;
    background: #f5f5f5;
    color: #1f1f1f;
    padding: 30px;
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 { font-size: 1.3rem; margin: 1.8rem 0 1.2rem; }
  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: .5rem;
    padding: 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    margin-bottom: 22px;
    text-align: center;
  }
  svg { display: block; margin: 0 auto; background: #fff; max-width: 100%; height: auto; }
</style>
</head>
<body>

<h1>Объединённый рисунок (вид спереди + вид сбоку с размерами)</h1>
<div class="card">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300">
    <defs>
      <!-- Defs для рисунка 1 -->
      <path id="markText" d="M 56.5,193 A 307,307 0 0 1 543.5,193" fill="none"/>
      <clipPath id="tireClipFront">
        <path d="M 28,171 A 343,343 0 0 1 572,171 L 471,171 A 270,270 0 0 0 129,171 L 28,171 Z"/>
      </clipPath>
      <!-- Defs для рисунка 2 -->
      <clipPath id="dcSide"><ellipse cx="200" cy="140" rx="35" ry="70"/></clipPath>
    </defs>

    <!-- Рисунок 1: вид спереди (с маркировкой 195/65 R15) -->
    <g transform="translate(0, 62)">
      <path d="M 28,171 A 343,343 0 0 1 572,171 L 471,171 A 270,270 0 0 0 129,171 L 28,171 Z" fill="#1a1a1a"/>
      <path d="M 99,171 A 290,290 0 0 1 501,171 L 471,171 A 270,270 0 0 0 129,171 L 99,171 Z" fill="#7a7a7a"/>
      <g clip-path="url(#tireClipFront)">
        <path d="M 42,182 A 325,325 0 0 1 558,182" stroke="#7a7a7a" stroke-width="2.5" fill="none"/>
        <text font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#c8c8c8" font-weight="600" letter-spacing="2">
          <textPath href="#markText" startOffset="50%" text-anchor="middle">195/65 R15</textPath>
        </text>
      </g>
      <path d="M 26.8,170.2 A 344.5,344.5 0 0 1 573.2,170.2" stroke="#000" stroke-width="3" fill="none" stroke-dasharray="7,2" stroke-linecap="butt"/>
    </g>

    <!-- Рисунок 2: вид сбоку с размерами B, D, d, H — заполняется JS -->
    <g id="figSide" transform="translate(620, 15)"></g>
  </svg>
</div>

<script>
function pointOn(cx, t) {
  return [cx - 55 * Math.sin(t), 140 - 110 * Math.cos(t)];
}

function makeTireSide(targetEl) {
  targetEl.innerHTML = `
    <path d="M 174,30 A 55,110 0 0 0 174,250 L 200,250 A 55,110 0 0 1 200,30 Z" fill="#1a1a1a"/>
    <path class="herringbone" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="1.2"/>
    <path d="M 182.67,30 A 55,110 0 0 0 182.67,250" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path d="M 191.33,30 A 55,110 0 0 0 191.33,250" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path d="M 174,30 A 55,110 0 0 0 174,250" fill="none" stroke="#1f1f1f" stroke-width="1.5"/>
    <line x1="174" y1="30" x2="200" y2="30" stroke="#1f1f1f" stroke-width="1.5"/>
    <line x1="174" y1="250" x2="200" y2="250" stroke="#1f1f1f" stroke-width="1.5"/>
    <path d="M 200,30 A 55,110 0 1,1 200,250 A 55,110 0 1,1 200,30 Z M 200,70 A 35,70 0 1,1 200,210 A 35,70 0 1,1 200,70 Z" fill="#1a1a1a" fill-rule="evenodd"/>
    <path d="M 200,59 A 40,81 0 1,1 200,221 A 40,81 0 1,1 200,59 Z M 200,70 A 35,70 0 1,1 200,210 A 35,70 0 1,1 200,70 Z" fill="#7a7a7a" fill-rule="evenodd"/>
    <ellipse cx="200" cy="140" rx="50" ry="100" fill="none" stroke="#7a7a7a" stroke-width="1.5"/>
    <ellipse cx="200" cy="140" rx="55" ry="110" fill="none" stroke="#1f1f1f" stroke-width="1.5"/>
    <ellipse cx="200" cy="140" rx="35" ry="70" fill="none" stroke="#1f1f1f" stroke-width="1.3"/>
    <g clip-path="url(#dcSide)">
      <ellipse cx="174" cy="140" rx="35" ry="70" fill="none" stroke="#1f1f1f" stroke-width="1.3"/>
    </g>
    <g class="dims"></g>
  `;
}

function herringboneB5() {
  const cx_white_L = 182.67, cx_edge_L = 174;
  const cx_white_R = 191.33, cx_edge_R = 200;
  const length = 0.88, n = 18;
  const tMin = 0.30, tMax = Math.PI - 0.30;
  const dtFn = t => -0.20 * (1.4 - 0.8 * Math.sin(t));
  function stroke(t, cw, ce) {
    const dt = dtFn(t);
    const [sx, sy] = pointOn(cw, t);
    const cxe = cw + length * (ce - cw);
    const [ex, ey] = pointOn(cxe, t + dt);
    return `M ${sx.toFixed(2)},${sy.toFixed(2)} L ${ex.toFixed(2)},${ey.toFixed(2)} `;
  }
  let d = '';
  for (let i = 0; i < n; i++) {
    const t = tMin + (tMax - tMin) * (i + 0.5) / n;
    d += stroke(t, cx_white_L, cx_edge_L);
    d += stroke(t, cx_white_R, cx_edge_R);
  }
  return d;
}

function el(tag, attrs = {}, text) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text !== undefined) n.textContent = text;
  return n;
}

function drawArrow(g, cx, cy, dirX, dirY, color) {
  const len = 5, half = 2;
  const bx = cx - dirX * len;
  const by = cy - dirY * len;
  const perpX = -dirY, perpY = dirX;
  const p1x = bx + perpX * half, p1y = by + perpY * half;
  const p2x = bx - perpX * half, p2y = by - perpY * half;
  g.appendChild(el('path', {
    d: `M ${cx},${cy} L ${p1x},${p1y} L ${p2x},${p2y} Z`,
    fill: color,
  }));
}

function dimVert(parentG, xClose, xTip, y1, y2, label, opts = {}) {
  const {color = '#1f1f1f', labelGap = 12, extFromX = null, extColor = '#aaa'} = opts;
  const g = parentG.querySelector('.dims');
  const x = xClose;
  const ymid = (y1 + y2) / 2;
  const dir = Math.sign(xTip - xClose) || 1;
  if (extFromX !== null) {
    g.appendChild(el('line', {x1: extFromX, y1, x2: x, y2: y1,
      stroke: extColor, 'stroke-width': 0.7}));
    g.appendChild(el('line', {x1: extFromX, y1: y2, x2: x, y2: y2,
      stroke: extColor, 'stroke-width': 0.7}));
  }
  g.appendChild(el('line', {x1: x, y1, x2: x, y2,
    stroke: color, 'stroke-width': 1}));
  drawArrow(g, x, y1, 0, -1, color);
  drawArrow(g, x, y2, 0, +1, color);
  g.appendChild(el('text', {x: xTip + dir * labelGap, y: ymid + 5,
    'text-anchor': 'middle',
    'font-family': 'Cambria, Georgia, serif',
    'font-style': 'italic', 'font-size': 17, 'font-weight': 700,
    fill: color,
  }, label));
}

function dimHoriz(parentG, x1, x2, yClose, yTip, label, opts = {}) {
  const {color = '#1f1f1f', labelGap = 8} = opts;
  const g = parentG.querySelector('.dims');
  const y = yClose;
  const xmid = (x1 + x2) / 2;
  const dir = Math.sign(yTip - yClose) || -1;
  g.appendChild(el('line', {x1, y1: y, x2, y2: y,
    stroke: color, 'stroke-width': 1}));
  drawArrow(g, x1, y, -1, 0, color);
  drawArrow(g, x2, y, +1, 0, color);
  g.appendChild(el('text', {x: xmid, y: yTip + dir * labelGap,
    'text-anchor': 'middle',
    'font-family': 'Cambria, Georgia, serif',
    'font-style': 'italic', 'font-size': 17, 'font-weight': 700,
    fill: color,
  }, label));
}

// ============================================================
//   Заполнение рисунка 2
// ============================================================
const figSide = document.getElementById('figSide');
makeTireSide(figSide);
figSide.querySelector('.herringbone').setAttribute('d', herringboneB5());

dimHoriz(figSide, 174, 200, 24, 14, 'B', {color: '#000'});
dimVert(figSide, 275, 285, 30,  70,  'H', {extFromX: 200});
dimVert(figSide, 275, 285, 70,  210, 'd', {extFromX: 200});
dimVert(figSide, 275, 285, 210, 250, 'H', {extFromX: 200});
dimVert(figSide, 320, 330, 30,  250, 'D', {extFromX: 200});
</script>

</body>
</html>
