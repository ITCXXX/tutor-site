<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Квартира — финальный план</title>
<style>
  body{font-family:Cambria,Georgia,serif;background:#f5f5f5;color:#1f1f1f;padding:30px;max-width:1000px;margin:0 auto;}
  h1{font-size:1.3rem;margin:1.6rem 0 1rem;}
  .card{background:#fff;border:1px solid #e0e0e0;border-radius:.5rem;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:center;}
  svg{display:block;margin:0 auto;background:#fff;max-width:100%;height:auto;}
</style>
</head>
<body>
<h1>Двухкомнатная квартира — финальный план</h1>
<div class="card"><svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg></div>

<script>
const CELL=18, OFFSET=12;
const ROOMS={
 1:[[1,1],[1,7],[6,7],[6,1]], 2:[[6,1],[6,7],[11,7],[11,6],[30,6],[30,1]],
 3:[[30,1],[30,6],[34,6],[34,1]], 4:[[23,6],[23,15],[34,15],[34,6]],
 5:[[23,15],[23,19],[34,19],[34,15]], 6:[[11,6],[11,19],[23,19],[23,6]],
 7:[[1,7],[1,16],[11,16],[11,7]], 8:[[1,16],[1,19],[11,19],[11,16]],
};
const ROOM_LABEL={1:[3.5,4],2:[20,3.5],3:[32,3.5],4:[28.5,10.5],5:[28.5,17],6:[17,12.5],7:[6,11.5],8:[6,17.5]};
const WINDOWS=[[[1,19],[11,19]],[[3,16],[6,16]],[[14,19],[20,19]],[[23,19],[34,19]],[[29,15],[32,15]]];
const DOORS=[[[25,15],[27,15]],[[25,6],[27,6]],[[30,4],[30,2]],[[7,16],[9,16]],[[11,13],[11,11]],[[7,7],[9,7]],[[6,5],[6,3]],[[13,6],[15,6]],[[10,1],[12,1]]];
const SPECIAL=['1,19|11,19','23,19|34,19'];   // верхние окна комнат 8 и 5 — отступ 1,5px
const INSET=1.5;
const key=(a,b)=>`${a[0]},${a[1]}|${b[0]},${b[1]}`;

const xs=[],ys=[]; for(const r in ROOMS)for(const p of ROOMS[r]){xs.push(p[0]);ys.push(p[1]);}
const origMaxX=Math.max(...xs);
const xMin=Math.min(...xs)-1, xMax=origMaxX+11;       // место справа под легенду
const yMin=Math.min(...ys)-1, yMax=Math.max(...ys)+1;
const W=(xMax-xMin)*CELL, H=(yMax-yMin)*CELL;
const px=x=>OFFSET+(x-xMin)*CELL, py=y=>OFFSET+(yMax-y)*CELL;
const svg=document.getElementById('plan');
svg.setAttribute('viewBox',`0 0 ${W+2*OFFSET} ${H+2*OFFSET}`);
svg.setAttribute('width',W+2*OFFSET);svg.setAttribute('height',H+2*OFFSET);
function el(t,a={},txt){const n=document.createElementNS('http://www.w3.org/2000/svg',t);for(const k in a)n.setAttribute(k,a[k]);if(txt!==undefined)n.textContent=txt;svg.appendChild(n);return n;}

// сетка
for(let x=Math.ceil(xMin);x<=Math.floor(xMax);x++)el('line',{x1:px(x),y1:py(yMin),x2:px(x),y2:py(yMax),stroke:'#d0d0d0','stroke-width':0.7});
for(let y=Math.ceil(yMin);y<=Math.floor(yMax);y++)el('line',{x1:px(xMin),y1:py(y),x2:px(xMax),y2:py(y),stroke:'#d0d0d0','stroke-width':0.7});

// стены — непрерывные ломаные, разрыв только в дверных проёмах
function doorGaps(P,Q){const g=[];for(const[d0,d1]of DOORS){
  if(P[1]===Q[1]&&d0[1]===P[1]&&d1[1]===P[1]){const a=Math.min(P[0],Q[0]),b=Math.max(P[0],Q[0]);let g0=Math.max(a,Math.min(d0[0],d1[0])),g1=Math.min(b,Math.max(d0[0],d1[0]));if(g1>g0){const L=Q[0]-P[0];let t0=(g0-P[0])/L,t1=(g1-P[0])/L;if(t0>t1)[t0,t1]=[t1,t0];g.push([t0,t1]);}}
  else if(P[0]===Q[0]&&d0[0]===P[0]&&d1[0]===P[0]){const a=Math.min(P[1],Q[1]),b=Math.max(P[1],Q[1]);let g0=Math.max(a,Math.min(d0[1],d1[1])),g1=Math.min(b,Math.max(d0[1],d1[1]));if(g1>g0){const L=Q[1]-P[1];let t0=(g0-P[1])/L,t1=(g1-P[1])/L;if(t0>t1)[t0,t1]=[t1,t0];g.push([t0,t1]);}}}
  g.sort((u,v)=>u[0]-v[0]);return g;}
const lp=(P,Q,t)=>[px(P[0]+(Q[0]-P[0])*t),py(P[1]+(Q[1]-P[1])*t)];
function wallRuns(v){const segs=[],n=v.length;
  for(let i=0;i<n;i++){const P=v[i],Q=v[(i+1)%n],gaps=doorGaps(P,Q);const cuts=[0];for(const[a,b]of gaps)cuts.push(a,b);cuts.push(1);
    for(let k=0;k+1<cuts.length;k++){const ta=cuts[k],tb=cuts[k+1];if(tb-ta<1e-9)continue;const mid=(ta+tb)/2,inGap=gaps.some(([a,b])=>mid>a+1e-9&&mid<b-1e-9);segs.push({a:lp(P,Q,ta),b:lp(P,Q,tb),wall:!inGap});}}
  const m=segs.length;if(segs.every(s=>s.wall)){const pts=segs.map(s=>s.a);pts.push(segs[0].a);return[pts];}
  let start=segs.findIndex(s=>!s.wall);const runs=[];let cur=null;
  for(let k=0;k<m;k++){const s=segs[(start+k)%m];if(s.wall){if(!cur)cur=[s.a,s.b];else cur.push(s.b);}else{if(cur){runs.push(cur);cur=null;}}}
  if(cur)runs.push(cur);return runs;}
for(const r in ROOMS)for(const run of wallRuns(ROOMS[r])){const d=run.map((p,i)=>`${i===0?'M':'L'} ${p[0]},${p[1]}`).join(' ');el('path',{d,fill:'none',stroke:'#000','stroke-width':3,'stroke-linejoin':'miter'});}

// номера комнат — в кружках
for(const r in ROOM_LABEL){const[x,y]=ROOM_LABEL[r];el('circle',{cx:px(x),cy:py(y),r:9,fill:'#fff',stroke:'#000','stroke-width':1.5});el('text',{x:px(x),y:py(y)+4.5,'text-anchor':'middle','font-family':'Arial','font-size':13,'font-weight':700,fill:'#000'},r);}

// окно — двойная линия; inset px (для окон 8 и 5 = 1,5)
function win(a,b,inset){let ax=px(a[0]),ay=py(a[1]),bx=px(b[0]),by=py(b[1]);
  const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
  ax+=ux*inset;ay+=uy*inset;bx-=ux*inset;by-=uy*inset;
  el('line',{x1:ax,y1:ay,x2:bx,y2:by,stroke:'#fff','stroke-width':4.5});
  el('line',{x1:ax+nx*1.8,y1:ay+ny*1.8,x2:bx+nx*1.8,y2:by+ny*1.8,stroke:'#000','stroke-width':1});
  el('line',{x1:ax-nx*1.8,y1:ay-ny*1.8,x2:bx-nx*1.8,y2:by-ny*1.8,stroke:'#000','stroke-width':1});}
for(const[a,b]of WINDOWS) win(a,b, SPECIAL.includes(key(a,b))?INSET:0);

// дверь — проём (разрыв стены) + полотно + дуга
function drawDoor(a,b,flip){let ax=px(a[0]),ay=py(a[1]),bx=px(b[0]),by=py(b[1]);
  const dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len;let nx=-uy,ny=ux;if(flip){nx=-nx;ny=-ny;}
  const sweep=flip?0:1,ex=ax+nx*len,ey=ay+ny*len;
  el('line',{x1:ax,y1:ay,x2:ex,y2:ey,stroke:'#000','stroke-width':1.4});
  el('path',{d:`M ${bx},${by} A ${len},${len} 0 0 ${sweep} ${ex},${ey}`,fill:'none',stroke:'#000','stroke-width':0.8});}
for(const[a,b]of DOORS){const isEnt=(a[0]===10&&a[1]===1&&b[0]===12&&b[1]===1);drawDoor(a,b,isEnt);}

// ===== Легенда справа =====
function legendLabel(xc,yc,text){el('text',{x:px(xc),y:py(yc)+5,'text-anchor':'start','font-family':'Cambria, Georgia, serif','font-size':15,fill:'#000'},text);}
const LX=origMaxX+2, LBL=origMaxX+4.2;
win([LX,16],[LX+1.6,16],0);  legendLabel(LBL,16,'окно');
drawDoor([LX,12],[LX+1.4,12],false); legendLabel(LBL,12,'дверь');
(function(){const y0=8,x1=LX,x2=LX+1,tick=1/3,sw=2.5;
  el('line',{x1:px(x1),y1:py(y0),x2:px(x2),y2:py(y0),stroke:'#000','stroke-width':sw});
  el('line',{x1:px(x1),y1:py(y0),x2:px(x1),y2:py(y0+tick),stroke:'#000','stroke-width':sw});
  el('line',{x1:px(x2),y1:py(y0),x2:px(x2),y2:py(y0+tick),stroke:'#000','stroke-width':sw});
  el('text',{x:px((x1+x2)/2),y:py(y0)+16,'text-anchor':'middle','font-family':'Cambria, Georgia, serif','font-size':14,fill:'#000'},'0,4 м');})();
</script>
</body>
</html>
